<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="shortcut icon" href="../images/flogo.png" type="images/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodieHub — Booking Confirmed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@200;300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #0e0414;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .confirm-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 5vw;
      position: relative;
      overflow: hidden;
    }

    /* background blobs */
    .confirm-section::before,
    .confirm-section::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .35;
      pointer-events: none;
    }
    .confirm-section::before {
      width: 500px; height: 500px;
      background-image: url("images/bg.jpg");
      top: -120px; left: -100px;
    }
   

    /* ── CARD ── */
    .confirm-card {
      position: relative;
      z-index: 2;
      background: rgb(73,16,73);
      border: 1px solid rgba(243,22,217,.25);
      border-radius: 28px;
      padding: 56px 48px;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(243,22,217,.08);
      animation: cardIn .6s cubic-bezier(.34,1.3,.64,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* ── ICON ── */
    .confirm-icon-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    .confirm-icon {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(243,22,217,.12);
      border: 2px solid rgba(243,22,217,.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: rgb(243,22,217);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(243,22,217,.35); }
      50%       { box-shadow: 0 0 0 14px rgba(243,22,217,0); }
    }

    /* ── HEADING ── */
    .confirm-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.9rem, 5vw, 2.6rem);
      font-weight: 600;
      color: #fff;
      text-align: center;
      line-height: 1.15;
      margin-bottom: 10px;
    }
    .confirm-title em {
      color: rgb(243,22,217);
      font-style: italic;
    }

    .confirm-subtitle {
      text-align: center;
      font-size: .82rem;
      color: rgba(242,220,228,.65);
      line-height: 1.7;
      margin-bottom: 32px;
    }

    /* ── REF BADGE ── */
    .confirm-ref {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(243,22,217,.1);
      border: 1.5px dashed rgba(243,22,217,.4);
      border-radius: 10px;
      padding: 12px 20px;
      margin-bottom: 28px;
    }

    .confirm-ref__label {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: rgba(242,220,228,.55);
    }

    .confirm-ref__value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: rgb(243,22,217);
      letter-spacing: .06em;
    }

    /* ── DETAILS GRID ── */
    .confirm-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 36px;
    }

    .detail-item {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(243,22,217,.15);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      animation: itemIn .5s ease both;
    }

    .detail-item:nth-child(1) { animation-delay: .1s; }
    .detail-item:nth-child(2) { animation-delay: .15s; }
    .detail-item:nth-child(3) { animation-delay: .2s; }
    .detail-item:nth-child(4) { animation-delay: .25s; }
    .detail-item:nth-child(5) { animation-delay: .3s; grid-column: 1 / -1; }

    @keyframes itemIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .detail-icon {
      width: 34px; height: 34px;
      background: rgba(243,22,217,.12);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgb(243,22,217);
      font-size: .8rem;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .detail-content__label {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: rgba(242,220,228,.45);
      margin-bottom: 3px;
    }

    .detail-content__value {
      font-size: .88rem;
      color: #fff;
      font-weight: 500;
      line-height: 1.4;
    }

    /* ── DIVIDER ── */
    .confirm-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(243,22,217,.3), transparent);
      margin-bottom: 28px;
    }

    /* ── ACTIONS ── */
    .confirm-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-primary {
      flex: 1;
      min-width: 160px;
      padding: 14px 20px;
      background: rgb(243,22,217);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background .2s, transform .15s, box-shadow .2s;
    }
    .btn-primary:hover {
      background: rgb(200,10,180);
      box-shadow: 0 8px 24px rgba(243,22,217,.35);
      transform: translateY(-2px);
    }
    .btn-primary:active { transform: scale(.97); }

    .btn-secondary {
      flex: 1;
      min-width: 160px;
      padding: 14px 20px;
      background: transparent;
      color: rgb(242,220,228);
      border: 1.5px solid rgba(243,22,217,.4);
      border-radius: 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: border-color .2s, background .2s, transform .15s;
    }
    .btn-secondary:hover {
      border-color: rgb(243,22,217);
      background: rgba(243,22,217,.08);
      transform: translateY(-2px);
    }
    .btn-secondary:active { transform: scale(.97); }

    /* ── NO-DATA fallback ── */
    .no-data {
      text-align: center;
      padding: 20px 0 10px;
      color: rgba(242,220,228,.5);
      font-size: .85rem;
      line-height: 1.8;
    }
    .no-data a {
      color: rgb(243,22,217);
      text-decoration: none;
      font-weight: 600;
    }
    .no-data a:hover { text-decoration: underline; }

    /* ── RESPONSIVE ── */
    @media (max-width: 520px) {
      .confirm-card {
        padding: 36px 22px;
        border-radius: 20px;
      }
      .confirm-details {
        grid-template-columns: 1fr;
      }
      .detail-item:nth-child(5) { grid-column: unset; }
      .confirm-actions { flex-direction: column; }
      .btn-primary, .btn-secondary { min-width: unset; }
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="./images/flogo.png" alt="Logo">
      <span>FoodieHub</span>
    </div>
    <a href="index.html"><i class="fa-solid fa-house-chimney"></i> Home</a>
    <a href="about.html"><i class="fa-solid fa-circle-info"></i> About</a>
    <a href="foodmenu.html"><i class="fa-solid fa-utensils"></i> Food Menu</a>
    <a href="Booking.html"><i class="fa-solid fa-calendar-check"></i> Book Table</a>
  </nav>

  <header>
    <div class="header">
      <div class="logo">
        <img src="./images/flogo.png" alt="Logo">
      </div>
      <div class="headerbar">
        <ul>
          <li><i class="fa-solid fa-magnifying-glass searchicon" id="mob-search-toggle"></i></li>
          <div class="search" id="mob-search">
            <input type="search" placeholder="Search…">
            <i class="fa-solid fa-magnifying-glass srchicon"></i>
          </div>
          <a href="#"><li><i class="fa-solid fa-user"></i></li></a>
        </ul>
        <div class="bar" id="hamburger">
          <i class="fa-solid fa-bars"></i>
          <i class="fa-solid fa-xmark"></i>
        </div>
      </div>
      <div class="nav">
        <ul>
          <a href="index.html"><li>Home</li></a>
          <a href="about.html"><li>About</li></a>
          <a href="foodmenu.html"><li>Food Menu</li></a>
          <a href="Booking.html"><li>Book Table</li></a>
        </ul>
      </div>
      <div class="account">
        <ul>
          <a href="index.html"><li><i class="fa-solid fa-house-chimney"></i></li></a>
          <a href="#"><li><i class="fa-solid fa-magnifying-glass searchicon" id="desk-search-toggle"></i></li></a>
          <div class="search" id="desk-search">
            <input type="search" placeholder="Search…">
            <i class="fa-solid fa-magnifying-glass srchicon"></i>
          </div>
          <a href="#"><li><i class="fa-solid fa-user"></i></li></a>
        </ul>
      </div>
    </div>
  </header>
  <section class="confirm-section">
    <div class="confirm-card" id="confirmCard">
      <!-- Filled by JS -->
    </div>
  </section>

  <script>
    /* ── SIDEBAR ── */
    const hamburger = document.getElementById('hamburger');
    const sidebar   = document.getElementById('sidebar');
    const overlay   = document.getElementById('overlay');

    function openSidebar()  { sidebar.classList.add('open');    overlay.classList.add('open');    hamburger.classList.add('open'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); hamburger.classList.remove('open'); }

    hamburger.addEventListener('click', () =>
      sidebar.classList.contains('open') ? closeSidebar() : openSidebar()
    );
    overlay.addEventListener('click', closeSidebar);

    function bindSearch(toggleId, searchId) {
      document.getElementById(toggleId).addEventListener('click', () => {
        const el = document.getElementById(searchId);
        el.classList.toggle('open');
        if (el.classList.contains('open')) el.querySelector('input').focus();
      });
    }
    bindSearch('desk-search-toggle', 'desk-search');
    bindSearch('mob-search-toggle',  'mob-search');

    /* ── RENDER CONFIRMATION ── */
    const card = document.getElementById('confirmCard');
    const raw  = sessionStorage.getItem('fh_booking');

    if (!raw) {
      // No data — show fallback
      card.innerHTML = `
        <div class="confirm-icon-wrap">
          <div class="confirm-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        </div>
        <h1 class="confirm-title">No Booking <em>Found</em></h1>
        <div class="no-data">
          <p>It looks like you arrived here directly.<br>
          Please fill out the booking form first.</p>
          <br>
          <a href="Booking.html"><i class="fa-solid fa-arrow-left"></i> Go to Booking Page</a>
        </div>
      `;
    } else {
      const b = JSON.parse(raw);

      card.innerHTML = `
        <div class="confirm-icon-wrap">
          <div class="confirm-icon"><i class="fa-solid fa-circle-check"></i></div>
        </div>

        <h1 class="confirm-title">Table <em>Reserved!</em></h1>
        <p class="confirm-subtitle">
          Thank you, ${b.name.split(' ')[0]}! Your table has been successfully booked.<br>
          We'll be expecting you — see you soon! 🍽️
        </p>

        <div class="confirm-ref">
          <span class="confirm-ref__label">Booking Reference</span>
          <span class="confirm-ref__value">${b.ref}</span>
        </div>

        <div class="confirm-details">
          <div class="detail-item">
            <div class="detail-icon"><i class="fa-solid fa-user"></i></div>
            <div class="detail-content">
              <div class="detail-content__label">Full Name</div>
              <div class="detail-content__value">${b.name}</div>
            </div>
          </div>
          <div class="detail-item">
            <div class="detail-icon"><i class="fa-solid fa-users"></i></div>
            <div class="detail-content">
              <div class="detail-content__label">Guests</div>
              <div class="detail-content__value">${b.guests}</div>
            </div>
          </div>
          <div class="detail-item">
            <div class="detail-icon"><i class="fa-solid fa-calendar-days"></i></div>
            <div class="detail-content">
              <div class="detail-content__label">Date</div>
              <div class="detail-content__value">${b.date}</div>
            </div>
          </div>
          <div class="detail-item">
            <div class="detail-icon"><i class="fa-solid fa-clock"></i></div>
            <div class="detail-content">
              <div class="detail-content__label">Time</div>
              <div class="detail-content__value">${b.time}</div>
            </div>
          </div>
          <div class="detail-item">
            <div class="detail-icon"><i class="fa-solid fa-envelope"></i></div>
            <div class="detail-content">
              <div class="detail-content__label">Email</div>
              <div class="detail-content__value">${b.email}</div>
            </div>
          </div>
        </div>

        <div class="confirm-divider"></div>

        <div class="confirm-actions">
          <a href="foodmenu.html" class="btn-primary">
            <i class="fa-solid fa-utensils"></i> Browse Menu
          </a>
          <a href="index.html" class="btn-secondary">
            <i class="fa-solid fa-house-chimney"></i> Go Home
          </a>
          <a href="Booking.html" class="btn-secondary">
            <i class="fa-solid fa-plus"></i> New Booking
          </a>
        </div>
      `;

      // Clear session so refreshing shows fallback instead of stale data
      sessionStorage.removeItem('fh_booking');
    }
  </script>
  <script src="search.js"></script>
</body>
</html>
